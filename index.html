<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routine</title>
<!-- Firebase (login + cloud database) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================
   DESIGN: modern minimal. Neutral surfaces, one ink colour,
   green = done, red = couldn't. Day and night themes.
   ===================================================== */
:root {
  --bg: #F6F6F3; --surface: #FFFFFF; --soft: #EFEFEB; --ink: #121212; --muted: #85857F; --line: #E4E3DE;
  --go: #1F9D5C; --stop: #E0483E; --warm: #E8A13A;
  --lime: var(--go); --orange: var(--stop); --violet: var(--ink); --amber: var(--warm); --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(18,18,18,.04), 0 8px 24px -12px rgba(18,18,18,.12);
  --sans: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --head: var(--sans); --serif: var(--sans);
  --r: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0E0F; --surface: #171719; --soft: #1F1F22; --ink: #F1F1EE; --muted: #8B8B86; --line: #2A2A2E;
    --go: #34C17A; --stop: #F0645A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E0F; --surface: #171719; --soft: #1F1F22; --ink: #F1F1EE; --muted: #8B8B86; --line: #2A2A2E;
  --go: #34C17A; --stop: #F0645A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { transition: background-color .4s; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); padding-top: env(safe-area-inset-top, 0px); overflow-x: hidden;
  -webkit-font-smoothing: antialiased; transition: background-color .4s, color .4s; }
main { max-width: 42rem; margin: 0 auto; padding: 0 1.1rem 7.5rem; }
.mono { font-family: var(--mono); font-size: .78rem; letter-spacing: 0; }
em { font-style: normal; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  max-width: 42rem; margin: 0 auto; padding: .9rem 1.1rem; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px);
  box-shadow: 0 0 0 100vmax color-mix(in srgb, var(--bg) 86%, transparent); clip-path: inset(0 -100vmax); color: var(--muted); }
.hudL { display: flex; align-items: center; gap: .6rem; }
.brand { font: 600 1rem var(--sans); color: var(--ink); letter-spacing: -.01em; }
.rec { width: 7px; height: 7px; border-radius: 50%; background: var(--go); display: inline-block; font-size: 0; }
.hudR { display: flex; align-items: center; gap: .6rem; }
.lvl { font: 500 .8rem var(--mono); color: var(--muted); padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 99px; }
.themeBtn { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: grid; place-items: center; font-size: .95rem; transition: transform .4s cubic-bezier(.3,1.4,.5,1); }
.themeBtn:hover { transform: rotate(-25deg); }

/* ---------- hero ---------- */
.marquee, .c3, .c4 { display: none !important; }
.hero { background: var(--surface); border-radius: var(--r); padding: 1.5rem 1.4rem 1.3rem; margin-top: .6rem; box-shadow: var(--shadow); border: 1px solid var(--line); position: relative; }
.hello { margin: 0; color: var(--muted); font-size: .95rem; }
.hello b { color: var(--ink); font-weight: 500; }
.bal { display: flex; align-items: baseline; gap: .55rem; margin: .5rem 0 1.1rem; }
.big { font: 600 clamp(3.8rem, 17vw, 5.5rem)/1 var(--sans); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.bal em { color: var(--muted); font-size: 1rem; }
.hero.neg .big { color: var(--stop); }
.hero.cut { animation: ring .7s ease; }
@keyframes ring { 30% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--go) 30%, transparent), var(--shadow); } }
.segs { display: flex; gap: 3px; height: 6px; }
.segs span { flex: 1; border-radius: 99px; background: var(--soft); transition: background .35s; }
.segs span.on { background: var(--go); }
.segs span.x { background: var(--stop); }
.status { margin: .75rem 0 0; color: var(--muted); font: 400 .85rem var(--sans); }
.heroRow { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: 1rem; }
.streakTag { margin: 0; font-size: .82rem; padding: .35rem .75rem; border-radius: 99px; display: inline-flex; gap: .35rem; align-items: center; }
.streakTag.lit { background: color-mix(in srgb, var(--warm) 16%, transparent); color: var(--ink); }
.streakTag.off { color: var(--muted); background: var(--soft); }
.streakTag.lit .fl { display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.15); } }
.split span { display: inline-block; animation: rise .5s cubic-bezier(.2,.9,.3,1) both; animation-delay: calc(var(--i) * 25ms); }
@keyframes rise { from { transform: translateY(.35em); opacity: 0; } }

/* ---------- buttons ---------- */
.btn { font: 500 1rem var(--sans); background: var(--ink); color: var(--bg); border: 0; border-radius: 12px; padding: .9rem 1rem; cursor: pointer;
  transition: transform .15s, opacity .15s; }
.btn:hover { opacity: .88; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { opacity: 1; border-color: var(--muted); }
.btn.warn { color: var(--stop); }
.btn.small { padding: .35rem .75rem; font-size: .82rem; border-radius: 99px; }
.btn.wide { width: 100%; margin-top: 1rem; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; }

/* ---------- day strip ---------- */
.stripWrap { display: flex; gap: .5rem; margin-top: 1.8rem; }
.strip { flex: 1; display: flex; gap: .4rem; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 4px 6px 0; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.dayBtn { flex: none; scroll-snap-align: start; width: 3.6rem; padding: .55rem 0; border-radius: 14px; cursor: pointer; position: relative;
  background: transparent; border: 1px solid transparent; color: var(--ink); display: grid; justify-items: center; gap: .1rem; transition: background .2s, color .2s, border-color .2s; }
.dayBtn:hover { background: var(--surface); border-color: var(--line); }
.dayBtn .wd { font-size: .68rem; color: var(--muted); }
.dayBtn .dn { font: 600 1.2rem/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.dayBtn.today .dn { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.dayBtn.past { color: var(--muted); }
.dayBtn.sel { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.dayBtn.sel .wd { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.dayBtn .dot { position: absolute; top: 4px; right: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--warm); font-size: 0; padding: 0; min-width: 0; }
.jump { flex: none; position: relative; width: 3.2rem; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 1.1rem; }
.jump input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.jump input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }

/* ---------- headings ---------- */
h2 { display: flex; align-items: baseline; gap: .6rem; margin: 2.4rem 0 .9rem; font: 600 1.6rem/1.1 var(--sans); letter-spacing: -.03em; }
h2 em { font-size: .85rem; color: var(--muted); font-weight: 400; letter-spacing: 0; }
#dayTitle { margin-top: 1.4rem; font-size: 2rem; }
.sec { display: flex; justify-content: space-between; margin: 1.6rem 0 .5rem; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; font-family: var(--sans); font-weight: 500; }
#dayTitle + .sec { margin-top: .4rem; }
#sections .sec:first-child { margin-top: 1.6rem; }
.dayNote { color: var(--muted); margin: .8rem 0 0; font-size: .85rem; }
.dayNote:empty { display: none; }

/* ---------- lists ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.item { display: flex; align-items: center; position: relative; border-top: 1px solid var(--line); transition: background .25s; }
.item:first-child { border-top: 0; }
.item .grip { width: 1.3rem; flex: none; display: grid; place-items: center; color: var(--muted); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-size: .8rem; }
.item.dragging { background: var(--soft); }
.item .info { flex: 1; min-width: 0; padding: .9rem .4rem; display: grid; gap: .1rem .7rem; grid-template-columns: auto 1fr; grid-template-areas: "t st" "who who"; }
.item .t { grid-area: t; font: 500 .78rem var(--mono); color: var(--muted); white-space: nowrap; }
.item .t.none { display: none; }
.item .st { grid-area: st; justify-self: start; }
.item .who { grid-area: who; min-width: 0; }
.item .nm { font-size: 1.05rem; font-weight: 500; letter-spacing: -.01em; overflow-wrap: anywhere; transition: color .25s; }
.item.done .nm { color: var(--muted); }
.item.failed .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--stop); }
.item .fire { margin-left: .4rem; font-size: .8rem; color: var(--warm); }
.item .bell { margin-left: .4rem; font-size: .75rem; color: var(--muted); white-space: nowrap; }
.item .meta { display: block; font-size: .78rem; color: var(--muted); }
.st { font-size: .68rem; font-weight: 500; letter-spacing: .04em; padding: .12rem .5rem; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.st.done { background: color-mix(in srgb, var(--go) 14%, transparent); color: var(--go); }
.st.fail { background: color-mix(in srgb, var(--stop) 13%, transparent); color: var(--stop); }
.st.late { color: var(--warm); background: color-mix(in srgb, var(--warm) 14%, transparent); }
.st.plan { background: var(--soft); color: var(--ink); }
.st.flip { animation: fadeUp .35s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(3px); } }
.acts { display: flex; align-items: center; gap: .4rem; padding: 0 .3rem; }
.ib { flex: none; background: none; border: 0; color: var(--muted); width: 2rem; height: 2rem; border-radius: 8px; font-size: .95rem; cursor: pointer; }
.ib:hover { color: var(--ink); background: var(--soft); }
.yes, .no { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; cursor: pointer; display: grid; place-items: center; font: 600 1rem var(--sans);
  background: transparent; border: 1.5px solid var(--line); color: var(--muted); transition: transform .2s cubic-bezier(.3,1.5,.5,1), background .2s, border-color .2s, color .2s; }
.yes:hover { border-color: var(--go); color: var(--go); }
.no:hover { border-color: var(--stop); color: var(--stop); }
.yes:active, .no:active { transform: scale(.9); }
.yes[aria-pressed="true"] { background: var(--go); border-color: var(--go); color: #fff; animation: popIn .35s cubic-bezier(.3,1.6,.5,1); }
.no[aria-pressed="true"] { background: var(--stop); border-color: var(--stop); color: #fff; animation: popIn .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes popIn { 0% { transform: scale(.7); } }
.item .edit { margin-right: .3rem; }
.item.pop { animation: rowPop .4s ease; }
@keyframes rowPop { 40% { background: var(--soft); } }
.item.new { animation: rowNew 1.8s ease; }
@keyframes rowNew { 0%, 35% { background: color-mix(in srgb, var(--warm) 18%, var(--surface)); } }
@media (hover: hover) {
  .item .grip, .item .edit { opacity: 0; transition: opacity .2s; }
  .item:hover .grip, .item:hover .edit, .item:focus-within .edit { opacity: 1; }
}
.empty { color: var(--muted); padding: 1.1rem 1.2rem; margin: 0; font-size: .9rem; }
.offList { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: 1rem; color: var(--muted); font-size: .82rem; }
.chip { font: 400 .82rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: .3rem .75rem; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.addRow { display: grid; grid-template-columns: 2fr 1fr; gap: .6rem; margin-top: 1.1rem; }
.addRow .btn { width: 100%; }
.float { position: fixed; z-index: 50; pointer-events: none; font: 600 1.4rem var(--sans); color: var(--go); animation: floatUp .9s cubic-bezier(.2,.8,.3,1) forwards; }
.float.minus { color: var(--stop); }
@keyframes floatUp { to { transform: translateY(-60px); opacity: 0; } }

/* ---------- inputs + journal ---------- */
label.f, span.f { display: block; color: var(--muted); margin-bottom: .3rem; font-size: .8rem; font-family: var(--sans); }
input, select, textarea { width: 100%; font: 400 1rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .65rem .75rem; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); }
textarea { min-height: 5.5rem; line-height: 1.5; resize: vertical; }
input.shake { animation: shake .35s, redEdge 1.2s; }
@keyframes redEdge { 0%, 70% { border-color: var(--stop); } }
.moods { display: flex; gap: .4rem; margin-bottom: .7rem; }
.moods button { flex: 1; font-size: 1.5rem; padding: .5rem 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; filter: grayscale(1); opacity: .6; transition: transform .2s, opacity .2s, filter .2s; }
.moods button:hover { opacity: 1; }
.moods button[aria-pressed="true"] { filter: none; opacity: 1; border-color: var(--ink); transform: translateY(-2px); }

/* ---------- profile ---------- */
.me { padding-top: 1.6rem; }
.avatar { width: 4.5rem; height: 4.5rem; display: grid; place-items: center; font-size: 2.2rem; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.me h1 { margin: .9rem 0 0; font: 600 clamp(2.4rem, 10vw, 3.4rem)/1 var(--sans); letter-spacing: -.04em; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin-top: 1.4rem; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; }
.stats b { display: block; font: 600 2rem/1 var(--sans); letter-spacing: -.04em; }
.stats span { color: var(--muted); font-family: var(--sans); font-size: .8rem; }
.lvlbar { height: 6px; background: var(--soft); margin-top: 1rem; border-radius: 99px; overflow: hidden; }
.lvlbar i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .6s; }
.lvlText { color: var(--muted); margin-top: .45rem; }
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.2rem 1.3rem; }
.report .pct { font: 600 2.6rem/1 var(--sans); letter-spacing: -.04em; }
.report .pct em { font-size: .9rem; color: var(--muted); font-weight: 400; margin-left: .4rem; letter-spacing: 0; }
.report p { margin: .4rem 0 0; } .report .mono { color: var(--muted); }
.heat { display: flex; gap: 3px; }
.hcol { flex: 1; display: grid; gap: 3px; }
.hc { aspect-ratio: 1; border: 0; padding: 0; border-radius: 3px; background: var(--soft); cursor: pointer; }
.hc.future { background: transparent; cursor: default; }
.hc.rest { background: transparent; box-shadow: inset 0 0 0 1px var(--warm); }
.hc.none { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.hc.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.heatInfo { margin-top: .7rem; color: var(--muted); min-height: 1.4em; }
.bars { display: grid; gap: .85rem; }
.bar .top { display: flex; justify-content: space-between; gap: 1rem; font-size: .95rem; }
.bar .track { height: 5px; background: var(--soft); margin-top: .35rem; border-radius: 99px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--go); border-radius: 99px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); gap: .5rem; }
.badge { border: 1px solid var(--line); padding: .9rem .5rem; text-align: center; border-radius: 14px; background: var(--surface); }
.badge .ic { font-size: 1.6rem; display: block; }
.badge .bn { font-size: .82rem; }
.badge.got { border-color: var(--ink); }
.badge:not(.got) { opacity: .35; filter: grayscale(1); }
.settings { display: grid; gap: 1.1rem; }
.note { color: var(--muted); font-size: .82rem; margin: .35rem 0 0; }
.fold { border-top: 1px solid var(--line); margin-top: 1.4rem; }
.fold summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: .6rem; padding: 1rem 0; font: 600 1.15rem var(--sans); letter-spacing: -.02em; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "+"; margin-left: auto; color: var(--muted); transition: transform .3s; font-weight: 400; }
.fold[open] summary::after { transform: rotate(45deg); }
.fold summary em { font-size: .85rem; color: var(--muted); font-weight: 400; }
.fold > :not(summary) { margin-bottom: 1.2rem; }
.log { list-style: none; padding: 0; margin: 0; }
.log li { display: grid; grid-template-columns: 3.6rem 1fr auto; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.log .d { color: var(--muted); }
.log .p { font-weight: 600; font-variant-numeric: tabular-nums; } .log .p.plus { color: var(--go); } .log .p.minus { color: var(--stop); }

/* ---------- nav + overlays ---------- */
nav { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; z-index: 30;
  border-radius: 99px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--shadow); }
nav a { font: 500 .85rem var(--sans); text-decoration: none; color: var(--muted); padding: .6rem 1.25rem; border-radius: 99px; text-transform: capitalize; transition: background .25s, color .25s; }
nav a.on { background: var(--ink); color: var(--bg); }
.wipe { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: grid; }
.wipe:not(.go) { visibility: hidden; }
.wipe i { grid-area: 1/1; background: var(--bg); opacity: 0; }
.wipe i:nth-child(2) { display: none; }
.wipe.go i { animation: veil .5s ease forwards; }
@keyframes veil { 45%, 55% { opacity: 1; } 100% { opacity: 0; } }
.slam { position: fixed; inset: 0; z-index: 70; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); color: var(--ink);
  display: grid; place-content: center; text-align: center; padding: 2rem; cursor: pointer; animation: fadeIn .3s ease; }
.slam b { display: block; font: 600 clamp(5rem, 26vw, 9rem)/1 var(--sans); letter-spacing: -.06em; color: var(--stop); animation: rise .5s cubic-bezier(.2,.9,.3,1) both; }
.slam em { display: block; margin-top: .5rem; font-size: 1.2rem; color: var(--muted); }
.slam .mono { margin-top: 2rem; color: var(--muted); }
.slam.shake b { animation: rise .5s cubic-bezier(.2,.9,.3,1) both, shake .4s .5s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
@keyframes fadeIn { from { opacity: 0; } }
.burst { position: fixed; inset: 0; z-index: 65; pointer-events: none; display: grid; place-content: center; text-align: center;
  background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(6px); color: var(--ink); animation: burstFade 1.6s ease forwards; }
.burst b { font: 600 clamp(4rem, 20vw, 7rem)/1 var(--sans); letter-spacing: -.05em; animation: rise .5s cubic-bezier(.2,.9,.3,1) both; }
.burst em { margin-top: .6rem; font-size: 1.1rem; color: var(--muted); }
@keyframes burstFade { 0% { opacity: 0; } 12%, 75% { opacity: 1; } 100% { opacity: 0; } }
.toast { position: fixed; left: 50%; top: calc(4rem + env(safe-area-inset-top, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: .75rem 1.15rem; font-size: .9rem;
  border-radius: 99px; max-width: 90vw; text-align: center; box-shadow: var(--shadow); animation: toast 4s cubic-bezier(.2,1,.3,1) forwards; }
@keyframes toast { 0% { transform: translate(-50%, -140%); opacity: 0; } 10%, 86% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -140%); opacity: 0; } }

/* ---------- sheets ---------- */
dialog { border: 1px solid var(--line); padding: 0; background: var(--surface); color: var(--ink); width: min(40rem, 100vw); max-width: 100vw; margin: auto auto 0; max-height: 92vh;
  border-radius: 22px 22px 0 0; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(10,10,10,.35); backdrop-filter: blur(4px); }
dialog[open] { animation: sheet .35s cubic-bezier(.2,1,.3,1); }
@keyframes sheet { from { transform: translateY(40px); opacity: 0; } }
#dlgForm, #tdlgForm { padding: 1.5rem 1.3rem calc(1.4rem + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr; gap: 1rem .8rem; }
#dlgForm .wide, #tdlgForm .wide { grid-column: 1 / -1; }
#dlgForm h3, #tdlgForm h3 { grid-column: 1 / -1; margin: 0; font: 600 1.5rem var(--sans); letter-spacing: -.03em; }
.days { display: flex; gap: .35rem; }
.days button { flex: 1; font: 500 .8rem var(--sans); padding: .6rem 0; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; border-radius: 10px; transition: background .2s, color .2s; }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.remPick button { font-size: .78rem; padding: .7rem .2rem; }
.dlgBtns { grid-column: 1 / -1; display: flex; gap: .5rem; margin-top: .3rem; }
.dlgBtns .btn { flex: 1; padding: .8rem .5rem; }

/* ---------- timer ---------- */
.timer { position: fixed; inset: 0; z-index: 75; background: var(--bg); color: var(--ink); display: grid; place-content: center; justify-items: center; text-align: center; padding: 2rem; animation: fadeIn .3s; }
.timer .tn { font-size: 1.2rem; color: var(--muted); }
.timer .clk { font: 300 clamp(5rem, 24vw, 11rem)/1 var(--sans); letter-spacing: -.06em; font-variant-numeric: tabular-nums; margin-top: .5rem; }
.timer .tb { width: min(28rem, 80vw); height: 4px; background: var(--soft); margin: 2rem 0; border-radius: 99px; overflow: hidden; }
.timer .tb i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s linear; }
.timer .row { justify-content: center; }
.timer.fin .clk { color: var(--go); }

/* ---------- profile / account page ---------- */
.acc { padding-top: 1.4rem; }
.accHead { display: flex; align-items: center; gap: 1.2rem; }
.accAva { flex: none; width: 5.5rem; height: 5.5rem; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem;
  background: var(--surface) center / cover no-repeat; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.accAva.small { width: 3.4rem; height: 3.4rem; font-size: 1.6rem; box-shadow: none; }
.accWho { min-width: 0; }
.accWho h1 { margin: 0; font: 600 clamp(1.9rem, 7vw, 2.8rem)/1.05 var(--sans); letter-spacing: -.04em; overflow-wrap: anywhere; }
.accSub { margin: .35rem 0 0; color: var(--muted); font-size: .88rem; }
.accGoal { margin: .35rem 0 0; font-size: .95rem; }
.accGoal:empty { display: none; }
.accGrid { display: grid; gap: 1rem; margin-top: 1.8rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.3rem 1.3rem 1.2rem; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 1rem; font: 600 1.1rem var(--sans); letter-spacing: -.02em; }
.card h3.mt { margin-top: 1.5rem; }
.card .row { margin-top: .9rem; }
.form2 { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem .8rem; }
.form2 .span2 { grid-column: 1 / -1; }
.photoRow { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.1rem; }
.photoRow .row { margin-top: 0; }
.err { color: var(--stop); font-size: .78rem; margin: .3rem 0 0; min-height: 0; }
.err:empty { display: none; }
.savedNote { color: var(--go); font-size: .82rem; margin: .8rem 0 0; min-height: 1.2em; }
.savedNote.on { animation: fadeUp .3s ease; }
.passState { margin: -.3rem 0 1rem; color: var(--muted); font-size: .9rem; }
.setRow { margin-top: 1.1rem; }
.sw { display: flex; align-items: center; gap: .8rem; padding: .7rem 0; border-top: 1px solid var(--line); cursor: pointer; font-size: .95rem; }
.sw:first-of-type { border-top: 0; }
.sw > span:first-child { flex: 1; }
.sw input[type="time"] { width: 7rem; padding: .4rem .5rem; }
.sw input[type="checkbox"], .swOnly input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw i, .swOnly i { flex: none; width: 2.6rem; height: 1.5rem; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); position: relative; transition: background .25s; display: block; }
.sw i::after, .swOnly i::after { content: ""; position: absolute; top: 2px; left: 2px; width: calc(1.5rem - 6px); height: calc(1.5rem - 6px); border-radius: 50%; background: var(--surface);
  box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.sw input:checked + i, .swOnly input:checked + i { background: var(--go); border-color: var(--go); }
.sw input:checked + i::after, .swOnly input:checked + i::after { transform: translateX(1.1rem); }
.sw input:focus-visible + i, .swOnly input:focus-visible + i { outline: 2px solid var(--ink); outline-offset: 2px; }
.swOnly { cursor: pointer; position: relative; }
.permRow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .6rem; padding-top: .9rem; margin-top: .3rem; border-top: 1px solid var(--line); font-size: .9rem; }
.permRow .row { margin-top: 0; }
.hudAva { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--line); background: var(--surface) center / cover no-repeat; display: grid; place-items: center;
  font-size: 1.05rem; text-decoration: none; overflow: hidden; }
.lock { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: grid; place-items: center; padding: 2rem; animation: fadeIn .3s; }
body.locked main, body.locked nav, body.locked .hud { visibility: hidden; }
.lockBox { width: min(22rem, 100%); display: grid; justify-items: center; gap: .6rem; text-align: center; }
.lockBox h2 { margin: .6rem 0 0; }
.lockBox input { text-align: center; font-size: 1.2rem; letter-spacing: .2em; }
.linkBtn { background: none; border: 0; color: var(--muted); font: 400 .85rem var(--sans); cursor: pointer; text-decoration: underline; margin-top: .4rem; }

/* ---------- personal records ---------- */
.prTitle { margin: 0 0 1.2rem; font: 600 clamp(1.9rem, 7vw, 2.8rem)/1.05 var(--sans); letter-spacing: -.04em; }
.prSetup { max-width: 34rem; }
.prSetup .row { margin-top: 1rem; }
#prMain { display: grid; gap: 1rem; }
.rankCard { display: grid; grid-template-columns: auto 1fr; gap: 1rem 1.3rem; align-items: center; }
.rankBig { font-size: 3.6rem; line-height: 1; width: 5.2rem; height: 5.2rem; border-radius: 50%; display: grid; place-items: center; background: var(--soft); }
.rankInfo { display: grid; gap: .15rem; }
.rankInfo b { font: 600 2rem/1.05 var(--sans); letter-spacing: -.04em; }
.rankScore { color: var(--muted); font-size: .9rem; }
.rankInfo .lvlbar { margin-top: .5rem; }
.bodySum { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; padding-top: .9rem; border-top: 1px solid var(--line); font-size: .92rem; }
.bodySum .note { margin: 0; }
.bodySum .btn { margin-left: auto; }
.form4 { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem .8rem; }
.form4 .span2 { grid-column: 1 / -1; }
.addBtnCell { display: flex; align-items: flex-end; }
.addBtnCell .btn { width: 100%; }
.liftGrid { display: grid; gap: 1rem; }
.lift { display: grid; gap: .55rem; }
.liftHead { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
.liftHead h3 { margin: 0; }
.lift .rk { font-size: .82rem; padding: .2rem .6rem; border-radius: 99px; background: var(--soft); white-space: nowrap; }
.lift .rk.muted { color: var(--muted); }
.lift.r3 .rk { background: color-mix(in srgb, var(--warm) 20%, transparent); }
.lift.r4 .rk, .lift.r5 .rk { background: color-mix(in srgb, #5b8def 18%, transparent); }
.liftBest { font-size: 1.05rem; }
.liftBest b { font-size: 1.35rem; letter-spacing: -.02em; }
.liftLines { display: flex; flex-wrap: wrap; gap: .3rem 1rem; color: var(--muted); font-size: .85rem; }
.lift .note { margin: 0; }
.sets { list-style: none; margin: .2rem 0 0; padding: 0; border-top: 1px solid var(--line); }
.sets li { display: grid; grid-template-columns: 1fr auto auto; gap: .6rem; align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.sets .d { color: var(--muted); }
.sets .v { font-variant-numeric: tabular-nums; }
.sets .ib { width: 1.7rem; height: 1.7rem; font-size: .75rem; }
.rankChip { display: inline-block; margin-top: .55rem; font-size: .88rem; padding: .3rem .75rem; border-radius: 99px; background: var(--soft); color: var(--ink); text-decoration: none; border: 1px solid var(--line); }
.rankChip:hover { border-color: var(--muted); }
@media (max-width: 520px) { nav a { padding: .55rem .75rem; font-size: .8rem; } }

/* ---------- friends, challenges, groups, family ---------- */
.frGrid { display: grid; gap: 1rem; }
.frGrid > .span2 { grid-column: 1 / -1; }
.idCard { display: grid; gap: .4rem; align-content: start; }
.bigCode { font: 600 2.4rem/1.1 var(--mono); letter-spacing: .18em; }
.inline { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .3rem; }
.inline input { flex: 1 1 10rem; min-width: 0; }
.cardHead { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-bottom: .6rem; }
.cardHead h3 { margin: 0; }
.reqRow { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .55rem 0; border-top: 1px solid var(--line); }
.reqRow > span:first-child { flex: 1; }
.reqCard { display: grid; gap: .4rem; padding: .9rem; border: 1px solid var(--line); border-radius: 12px; margin-top: .6rem; }
.fCard { border-top: 1px solid var(--line); }
.fCard:first-child { border-top: 0; }
.fCard > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .7rem; padding: .8rem 0; cursor: pointer; }
.fCard > summary::-webkit-details-marker { display: none; }
.fAva { width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-size: 1.2rem; flex: none; }
.fName { font-weight: 600; flex: 1 1 8rem; }
.fStats { color: var(--muted); font-size: .85rem; }
.fBody { padding: 0 0 1rem 3rem; display: grid; gap: .5rem; }
.fRoutines { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; font-size: .92rem; }
.fRoutines .done { color: var(--go); }
.fRoutines .fail { color: var(--stop); text-decoration: line-through; }
.chCard { border-top: 1px solid var(--line); padding: 1rem 0; display: grid; gap: .5rem; }
.chCard:first-child { border-top: 0; padding-top: .2rem; }
.mList { margin: 0; padding-left: 1.2rem; display: grid; gap: .2rem; }
.mEdit { display: grid; gap: .3rem; margin-bottom: .4rem; }
.mRow { display: flex; justify-content: space-between; align-items: center; padding: .4rem .6rem; border-radius: 8px; background: var(--soft); }
.pick { display: flex; align-items: center; gap: .6rem; padding: .35rem 0; cursor: pointer; }
.pick input { width: 1.15rem; height: 1.15rem; accent-color: var(--go); flex: none; }
.pick.tall { padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 10px; }
.pickList { display: grid; gap: .1rem; max-height: 12rem; overflow-y: auto; }
.lb { display: grid; gap: .25rem; padding: .7rem .9rem; border-radius: 12px; background: var(--soft); }
.lb .f { margin: 0 0 .2rem; }
.lbRow { display: flex; justify-content: space-between; font-size: .92rem; }
.mono { font-family: var(--mono); }
.answers { display: grid; gap: .45rem; }
.ansRow p { margin: .1rem 0 0; }
.a-accepted { color: var(--go); } .a-rejected { color: var(--stop); } .a-changes { color: var(--warm); }
.muted { color: var(--muted); }
.answerForm { display: grid; gap: .5rem; }
.answerForm textarea { min-height: 3.5rem; }
.backLink { display: inline-block; margin-bottom: .8rem; color: var(--muted); text-decoration: none; font-size: .9rem; }
.roleBtns button { padding: 1rem .5rem; font-size: .95rem; }
.roleBtns button:disabled { opacity: .35; cursor: not-allowed; }
.obGrid { display: grid; gap: .8rem; margin-bottom: .4rem; }
#chForm { padding: 1.5rem 1.3rem calc(1.4rem + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr; gap: 1rem .8rem; }
#chForm .wide { grid-column: 1 / -1; }
#chForm h3 { grid-column: 1 / -1; margin: 0; font: 600 1.5rem var(--sans); letter-spacing: -.03em; }
#chForm .chips { margin-top: .5rem; align-items: center; }
#chDlg { overflow-y: auto; }
#onboard .authBox { padding-bottom: 2rem; }
@media (max-width: 560px) { nav a { padding: .5rem .55rem; font-size: .74rem; } .fBody { padding-left: 0; } }

/* ---------- login + sync ---------- */
.rec.local { background: var(--muted); }
.rec.pending { background: var(--warm); }
.rec.err, .rec.off { background: var(--stop); }
.authScreen { position: fixed; inset: 0; z-index: 95; background: var(--bg); display: grid; place-items: center; padding: 1.5rem; overflow-y: auto; animation: fadeIn .3s; }
body.authing main, body.authing nav, body.authing .hud { visibility: hidden; }
.authBox { width: min(24rem, 100%); }
.authBrand { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: 1.05rem; margin-bottom: 1.6rem; }
.authBrand .rec { background: var(--go); }
.authBox h2 { margin: 0 0 .3rem; font-size: 2rem; }
.authBox .note { margin: 0 0 1.4rem; }
#authForm { display: grid; gap: .6rem; }
#authForm .btn { margin-top: .3rem; }
.orLine { display: flex; align-items: center; gap: .8rem; color: var(--muted); font-size: .8rem; margin: 1.1rem 0; }
.orLine::before, .orLine::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.setupBar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; margin-top: .6rem; padding: .7rem .9rem;
  border-radius: 12px; font-size: .88rem; background: color-mix(in srgb, var(--warm) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warm) 35%, var(--line)); }
.setupBar .muted { color: var(--muted); }
.setupBar .row { margin: 0; align-items: center; }
.setupBar .setupSteps { flex-basis: 100%; margin: .3rem 0 0; }
.setupSteps { margin: 0 0 1.5rem; padding-left: 1.2rem; display: grid; gap: .55rem; font-size: .92rem; line-height: 1.45; }
.vIcon { font-size: 3rem; margin-bottom: .6rem; }
#verify .authBox { display: grid; gap: .6rem; }
#verify h2, #verify p { margin: 0; }
.warnNote { margin: -.6rem 0 1.2rem; padding: .7rem .85rem; border-radius: 10px; font-size: .85rem; background: color-mix(in srgb, var(--warm) 16%, transparent); }
.langPick { margin-left: auto; display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 99px; }
.langPick button { font: 500 .72rem var(--sans); padding: .3rem .55rem; border: 0; border-radius: 99px; background: transparent; color: var(--muted); cursor: pointer; }
.langPick button.on { background: var(--ink); color: var(--bg); }
.okMsg { color: var(--go); font-size: .82rem; margin: 0; }
.okMsg:empty { display: none; }
.authBox .linkBtn { display: block; margin: .8rem 0 0; }
.accHead { flex-wrap: wrap; }
.signOutTop { margin-left: auto; align-self: flex-start; }
.acctRow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .6rem; padding: .2rem 0 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--line); font-size: .92rem; }

/* ---------- wide screens: sidebar + main ---------- */
@media (min-width: 1000px) {
  .hud, main { max-width: 88rem; }
  .hud { padding: 1.1rem 3rem; }
  main { padding: 0 3rem 8rem; }
  .tpage { display: grid; grid-template-columns: minmax(20rem, 25rem) minmax(0, 1fr); column-gap: 3.5rem; align-items: start;
    grid-template-areas: "hero list" "journal list"; grid-template-rows: auto 1fr; }
  .tpage .hero { grid-area: hero; margin-top: 1.4rem; padding: 2rem 1.8rem 1.6rem; }
  .tpage .listArea { grid-area: list; min-width: 0; }
  .tpage .journal { grid-area: journal; }
  .tpage .journal h2 { font-size: 1.3rem; margin-top: 2rem; }
  .stripWrap { margin-top: 1.4rem; }
  .big { font-size: 6.5rem; }
  #dayTitle { font-size: 2.8rem; }
  .item .info { grid-template-columns: 4.5rem 1fr auto; grid-template-areas: "t who st"; align-items: center; padding: 1.15rem .6rem; gap: 1rem; }
  .item .t { font-size: .9rem; }
  .item .t.none { display: block; color: var(--line); }
  .item .st { justify-self: end; font-size: .72rem; padding: .2rem .65rem; }
  .item .nm { font-size: 1.2rem; }
  .yes, .no { width: 2.9rem; height: 2.9rem; }
  .dayBtn { width: 4.4rem; padding: .7rem 0; } .dayBtn .dn { font-size: 1.4rem; }
  .ppage:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 3.5rem; align-items: start; }
  .ppage .pcol:last-child > h2:first-child { margin-top: 4.2rem; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .accGrid { grid-template-columns: 1fr 1fr; gap: 1.2rem; align-items: start; }
  .liftGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .frGrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .obGrid { grid-template-columns: 1fr 1fr; }
  #prMain { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  #prMain .liftGrid { grid-column: 1 / -1; }
  .form4 { grid-template-columns: 2fr 1fr 1fr; }
  .form4 .span2 { grid-column: auto; }
  .form4 #newExWrap { grid-column: 1 / -1; }
  .accGrid .span2 { grid-column: 1 / -1; }
  .accAva { width: 7rem; height: 7rem; font-size: 3.2rem; }
  .accAva.small { width: 3.4rem; height: 3.4rem; font-size: 1.6rem; }
  dialog { margin: auto; border-radius: 22px; width: min(36rem, 92vw); }
}
@media (max-width: 520px) { .form2 { grid-template-columns: 1fr; } }
@media (min-width: 1500px) { .tpage { grid-template-columns: 27rem minmax(0, 1fr); } .big { font-size: 7.5rem; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

</head>
<body>

<header class="hud">
  <span class="hudL"><span class="rec local" id="syncDot" title="">●</span><span class="brand">Routine</span><span class="mono" id="clock"></span></span>
  <span class="hudR"><span class="lvl" id="lvlTag">LVL 1</span><a href="#profile" class="hudAva" id="hudAva" aria-label="Profile"></a><button class="themeBtn" id="themeBtn" aria-label="Theme">☾</button></span>
</header>

<main>
  <div class="setupBar" id="setupBar" hidden>
    <span>⚠ <b data-t="setupTitle"></b> <span class="muted" data-t="setupShort"></span></span>
    <span class="row"><button class="btn ghost small" id="setupMore" data-t="setupMoreBtn"></button><button class="ib" id="setupClose" aria-label="Close">✕</button></span>
    <ol class="setupSteps" id="setupSteps" hidden>
      <li data-t="setup1"></li><li data-t="setup2"></li><li data-t="setup3"></li>
    </ol>
  </div>
  <!-- ========== TODAY ========== -->
  <section id="todayPage" class="tpage">
    <div class="marquee" id="marquee"><div id="marqueeText"></div></div>

    <div class="hero board" id="hero"><i class="c3"></i><i class="c4"></i>
      <p class="hello"><em data-t="hi">Salom,</em> <b id="greetName" class="split"></b></p>
      <div class="bal"><span class="big" id="bal">0</span><em data-t="coins">tanga</em></div>
      <div class="segs" id="segs"></div>
      <p class="status mono" id="status"></p>
      <div class="heroRow">
        <p class="streakTag" id="streakTag"></p>
        <button class="btn ghost small" id="restBtn"></button>
      </div>
    </div>

    <div class="listArea">
      <div class="stripWrap">
        <div class="strip" id="strip"></div>
        <label class="jump" title="Sana"><span aria-hidden="true">📅</span><input type="date" id="jump" aria-label="Date"></label>
      </div>
      <h2 id="dayTitle"></h2>
      <div class="sec mono"><span data-t="tasks"></span><span id="taskCount"></span></div>
      <div class="list" id="taskList"></div>
      <div id="sections"></div>
      <p class="dayNote mono" id="dayNote"></p>
      <div class="offList mono" id="offList"></div>
      <div class="addRow">
        <button class="btn" id="newTaskBtn" data-t="newTask"></button>
        <button class="btn ghost" id="newBtn" data-t="newRoutineShort"></button>
      </div>
    </div>

    <div class="journal">
      <h2><span data-t="dayEnd"></span> <em data-t="howWas"></em></h2>
      <div class="moods" id="moods">
        <button aria-pressed="false">😞</button><button aria-pressed="false">😕</button><button aria-pressed="false">😐</button><button aria-pressed="false">🙂</button><button aria-pressed="false">😄</button>
      </div>
      <textarea id="note" data-tp="notePh"></textarea>
    </div>
  </section>

  <!-- ========== PROFILE ========== -->

// ---------- 3. Dates ----------
function dayStr(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function today() { return dayStr(new Date()); }
function toDate(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n) { const d = toDate(s); d.setDate(d.getDate() + n); return dayStr(d); }
function weekday(s) { return toDate(s).getDay(); }
function fmtShort(s) {     // 3-noyabr 2026 / 3 ноября 2026 / 3 Nov 2026
  const d = toDate(s);
  if (state.lang === "uz") return d.getDate() + "-" + MONTHS_UZ[d.getMonth()] + " " + d.getFullYear();
  return d.toLocaleDateString(state.lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
}
function fmtDate(s) {
  const d = toDate(s);
  if (state.lang === "uz") return WEEKDAYS_UZ[d.getDay()] + ", " + d.getDate() + "-" + MONTHS_UZ[d.getMonth()];
  if (state.lang === "ru") { const t = d.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" }); return t.charAt(0).toUpperCase() + t.slice(1); }
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" });
}

// ---------- 5. Rules: schedule, done, counts ----------
function partFromTime(tm) { if (!tm) return "day"; const h = +tm.slice(0, 2); return h < 12 ? "morning" : h < 17 ? "day" : "evening"; }
function scheduled(h, d) { return h.created <= d && h.days.includes(weekday(d)); }
function isDone(id, d) { return (state.done[d] || []).includes(id); }
function isFailed(id, d) { return (state.failed[d] || {})[id] !== undefined; }
function countOf(h, d) {

  const c = (state.counts[d] || {})[h.id];
  return c !== undefined ? c : (isDone(h.id, d) ? h.target : 0);
}
function hasHabit(name, except) { return state.habits.some(h => h !== except && h.name.toLowerCase() === name.toLowerCase()); }
function placeByTime(h) {   // put a routine in its section, in clock order
  const sec = state.habits.filter(x => x.part === h.part && x !== h).sort((a, b) => a.order - b.order);
  let i = h.time ? sec.findIndex(x => x.time && x.time > h.time) : -1;
  if (i < 0) i = sec.length;
  sec.splice(i, 0, h); sec.forEach((x, k) => { x.order = k; });
}
function addHabit(v) {

  const h = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: v.name, time: v.time || "",
    part: v.part || partFromTime(v.time), minutes: +v.minutes || 0, coins: Math.max(1, +v.coins || 1),
    target: Math.max(1, +v.target || 1), days: [...(v.days || ALL_DAYS)], created: today(), order: 0 };
  state.habits.push(h); placeByTime(h);
  return true;
}

// ---------- 6. Coins, XP, levels ----------
function addCoins(amount, text, date) {
  state.balance += amount;
  state.history.unshift({ date: date || today(), text, amount });
  state.history = state.history.slice(0, 300);
}
function levelOf(xp) { return Math.floor(Math.sqrt(Math.max(0, xp) / 5)) + 1; }
function xpFor(level) { return 5 * (level - 1) * (level - 1); }

// Charge for missed routines on finished days (rest days are skipped)
function settle() {
  const t = today(); let lost = 0;
  if (!state.settled) { state.settled = addDays(t, -1); save(); return 0; }
  let d = addDays(state.settled, 1), guard = 0;
  while (d < t && guard++ < 400) {
    if (!state.rest[d]) {
      for (const h of state.habits) {
        if (scheduled(h, d) && !isDone(h.id, d) && !isFailed(h.id, d)) {
          const amt = h.coins * state.mult; lost += amt;
          addCoins(-amt, tr("hMiss") + h.name, d);
        }
      }
    }
    state.settled = d; d = addDays(d, 1);
  }
  checkProgress(); save(); return lost;
}

// ---------- 7. Streaks ----------
const bonus = () => (state.bonus ?? 5);   // extra coins every 7 days in a row (set in Profile)
// Unscheduled days and rest days are skipped: they neither count nor break.
function streakOf(h) {
  const t = today(); let d = t, n = 0, guard = 0;
  if (scheduled(h, t) && !state.rest[t] && !isDone(h.id, t)) d = addDays(t, -1);  // today still open
  while (d >= h.created && guard++ < 1000) {
    if (state.rest[d] || !scheduled(h, d)) { d = addDays(d, -1); continue; }
    if (!isDone(h.id, d)) break;
    n++; d = addDays(d, -1);
  }
  return n;
}
function perfectDay(d) {   // "yes", "no" or "skip"
  if (state.rest[d]) return "skip";
  const hs = state.habits.filter(h => scheduled(h, d));
  if (!hs.length) return "skip";
  return hs.every(h => isDone(h.id, d)) ? "yes" : "no";
}
function perfectStreak() {
  if (!state.habits.length) return 0;
  const first = state.habits.reduce((m, h) => h.created < m ? h.created : m, "9999");
  const t = today(); let d = perfectDay(t) === "no" ? addDays(t, -1) : t, n = 0, guard = 0;
  while (d >= first && guard++ < 3700) {
    const r = perfectDay(d);
    if (r === "no") break;
    if (r === "yes") n++;
    d = addDays(d, -1);
  }
  return n;
}

// ---------- 9. Sound and vibration ----------
let ac;
function tone(notes, type = "triangle", len = .09) {
  if (!state.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime;
    notes.forEach((f, i) => {
      if (!f) return;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + i * len);
      g.gain.exponentialRampToValueAtTime(.15, t0 + i * len + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + i * len + len * 1.6);
      o.connect(g).connect(ac.destination); o.start(t0 + i * len); o.stop(t0 + i * len + len * 1.8);
    });
  } catch (e) {}
}

// ---------- 11. Ticking (normal and counted routines) ----------
function complete(h) {
  const d = today();
  (state.done[d] || (state.done[d] = [])).push(h.id);
  addCoins(h.coins, tr("hDone") + h.name); state.xp += h.coins;
  let amt = h.coins;
  const s = streakOf(h);
  if (s > 0 && s % 7 === 0) {
    amt += bonus(); state.xp += bonus();
    addCoins(bonus(), tr("hStreak", s) + h.name);
    burst("🔥" + s, tr("streakBurst", s, h.name, bonus()), "var(--violet)");
  }
  SFX.tick(); buzz(30); restart($("hero"), "cut");
  return amt;
}
function uncomplete(h) {

  let amt = -h.coins;

}
function unfail(h) {

}

  else {

    if (h.target > 1) (state.counts[d] || (state.counts[d] = {}))[h.id] = 0;
    const pen = state.rest[d] ? 0 : h.coins * state.mult;       // no penalty on a rest day
    (state.failed[d] || (state.failed[d] = {}))[h.id] = pen;
    if (pen) addCoins(-pen, tr("hFail") + h.name);
    amt -= pen; SFX.penalty(); buzz([60, 40, 60]);

  checkProgress(); save(); render();
  const row = document.querySelector(`.item[data-id="${h.id}"]`); restart(row, "pop");

}
function setCount(h, n, ev) {
  const d = today(), old = countOf(h, d);

  if (n > old && isFailed(h.id, d)) refund = unfail(h);          // changed mind: did it after all

    floatCoins(ev && ev.clientX ? ev.clientX : r.right - 40, ev && ev.clientY ? ev.clientY : r.top + r.height / 2, amt);
  }
}

// ---------- 12. Timer ----------
let timer = null, timerLoop = null;

  const sec = Math.ceil(left / 1000);

  $("tBar").style.width = (100 * (1 - left / timer.total)) + "%";
  
}

// ---------- 13. Drag to reorder (hold ⋮⋮ and move) ----------
function initDrag(grip, row, list) {
  grip.addEventListener("pointerdown", e => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId); row.classList.add("dragging");
    const move = ev => {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const over = el && el.closest(".item");
      if (!over || over === row || over.parentNode !== list) return;
      const r = over.getBoundingClientRect();
      list.insertBefore(row, ev.clientY < r.top + r.height / 2 ? over : over.nextSibling);
    };
    const up = () => {
      grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up);
      row.classList.remove("dragging");
      [...list.querySelectorAll(".item")].forEach((el, i) => { const h = state.habits.find(x => x.id === el.dataset.id); if (h) h.order = i; });
      save(); render();
    };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
  });
}

// value used for ranking: estimated 1RM, or max reps for pull-ups
function setValue(id, x) { return liftOf(id) && liftOf(id).reps ? x.r : e1rm(x.w, x.r); }
function bestSet(id) {

// rank level 0..5 plus a 0..1 progress towards the next one
function rankOf(id, value) {

  const t = L[state.body.sex === "f" ? "f" : "m"], ratio = L.reps ? value : value / state.body.weight;
  let lvl = 0; while (lvl < 5 && ratio >= t[lvl]) lvl++;
  const lo = lvl ? t[lvl - 1] : 0, hi = lvl < 5 ? t[lvl] : null;
  const frac = hi === null ? 0 : Math.max(0, Math.min(1, (ratio - lo) / (hi - lo)));
  const need = hi === null ? 0 : (L.reps ? Math.ceil(hi - ratio) : hi * state.body.weight - value);

}
function overallRank() {

  if (!scores.length) return null;
  const avg = scores.reduce((a, r) => a + r.score, 0) / scores.length;
  const lvl = Math.min(5, Math.floor(avg));

}

// password (stored only as a salted SHA-256 hash)
async function hashPass(pw, salt) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {   // very old browsers: simple fallback hash
    let h = 5381; for (const ch of salt + pw) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return "f" + (h >>> 0).toString(16);
  }
}

// ---------- 18. Upgrade older saved data ----------
function migrate() {
  for (const k of ["done", "failed", "counts", "rest", "journal", "badges", "shownRem", "shownSum", "lifts", "prBest"]) if (!state[k] || typeof state[k] !== "object") state[k] = {};
  if (!Array.isArray(state.history)) state.history = [];
  if (!Array.isArray(state.tasks)) state.tasks = [];
  if (!Array.isArray(state.customEx)) state.customEx = [];
  for (const h of state.habits) {
    const b = BASICS.find(x => x.name === h.name);
    if (!Array.isArray(h.days)) h.days = [...(b ? b.days : ALL_DAYS)];
    if (!h.part) h.part = b ? b.part : partFromTime(h.time);
    if (!h.target) h.target = b ? b.target : 1;
    if (h.time === undefined) h.time = "";
    if (h.minutes === undefined) h.minutes = 0;
  }
  if (state.habits.some(h => h.order === undefined)) {
    [...state.habits].sort((a, b) => (a.time || "99").localeCompare(b.time || "99")).forEach((h, i) => { h.order = i; });
  }
  if (state.xp === undefined || state.xp === null) {
    state.xp = Math.max(0, state.history.filter(e => !/^(Missed|O'tkazildi|Пропущено)/.test(e.text)).reduce((s, e) => s + e.amount, 0));
  }
  if (state.lvlSeen === undefined) state.lvlSeen = levelOf(state.xp);
  if (!state.v2) { state.v2 = true; checkProgress(true); }   // award old achievements quietly
  save();
}

const reminded = new Set();

// ---------- live lists ----------

function addMission(n) { n = (n || "").trim(); if (!n || chDraft.some(m => m.toLowerCase() === n.toLowerCase())) return; chDraft.push(n); paintMissions(); }
function paintMissions() {

$("chMissionAdd").onclick = () => { addMission($("chMissionIn").value); $("chMissionIn").value = ""; $("chMissionIn").focus(); };

function nameOf(uid, g) {
  const f = social.fr.find(x => x.users.includes(uid));
  if (f && f.names && f.names[uid]) return f.names[uid];
  if (g && g.names && g.names[uid]) return g.names[uid];
  return social.shares[uid] ? personName(social.shares[uid]) : "?";
}
$("chForm").addEventListener("submit", async e => {
  e.preventDefault(); const err = $("chErr"); err.textContent = "";
  if ($("chMissionIn").value.trim()) { addMission($("chMissionIn").value); $("chMissionIn").value = ""; }
  const title = $("chName").value.trim();

  const u = myUid(), picked = [...$("chFriends").querySelectorAll("input:checked")].map(c => c.value);
  const gid = $("chGroupSel").value, g = social.gr.find(x => x.id === gid);
  const members = [...new Set([u, ...picked, ...(g ? g.members : [])])];
  if (members.length < 2) { err.textContent = tr("chNeedWho"); return; }

  try {
    await col("challenges").add({ creator: u, members, names, title, days: Math.max(1, Math.min(60, Math.round(+$("chDays").value) || 7)),
      start: $("chStart").value || today(), missions: chDraft.map((n, i) => ({ id: "m" + Date.now().toString(36) + i, name: n })),
      status: "proposed", responses: {}, progress: {}, groupId: gid || "", version: 1, createdAt: Date.now() });
    $("chDlg").close(); toast(tr("chSent"));
  } catch (er) { err.textContent = socialErr(er); }

function chState(c) { if (c.status !== "active") return c.status; return today() > addDays(c.start, c.days - 1) ? "done" : "active"; }
function autoActivate() {
  for (const c of social.ch) {
    if (c.status !== "proposed") continue;
    const others = c.members.filter(m => m !== c.creator);
    if (others.length && others.every(m => c.responses && c.responses[m] && c.responses[m].status === "accepted"))
      col("challenges").doc(c.id).update({ status: "active" }).catch(() => {});
  }
}
async function respond(c, status, note, sugg) {
  const list = (sugg || "").split(",").map(x => x.trim()).filter(Boolean);
  try { await col("challenges").doc(c.id).update({ ["responses." + myUid()]: { status, note: (note || "").trim(), sugg: list, at: Date.now() } }); toast(tr("answerSent")); }
  catch (e) { toast(socialErr(e)); }
}
async function repropose(c, missions) {
  try { await col("challenges").doc(c.id).update({ missions, responses: {}, version: (c.version || 1) + 1 }); toast(tr("chSent")); }
  catch (e) { toast(socialErr(e)); }
}
function applySuggestions(c) {
  const have = c.missions.map(m => m.name.toLowerCase()), add = [];
  Object.values(c.responses || {}).forEach(r => (r.sugg || []).forEach(n => { if (!have.includes(n.toLowerCase()) && !add.some(a => a.toLowerCase() === n.toLowerCase())) add.push(n); }));
  repropose(c, [...c.missions, ...add.map((n, i) => ({ id: "m" + Date.now().toString(36) + "s" + i, name: n }))]);
}
async function toggleMission(c, mid, on) {

  catch (e) { toast(socialErr(e)); }
}
function chCard(c) {
  const u = myUid(), st = chState(c), t = today(), end = addDays(c.start, c.days - 1);

      const row = el("div", "row");

      form.append(note, sugg, row); card.append(form);
    } else {

      card.append(row);
    }
  } else if (u === c.creator) {
    const row = el("div", "row"); row.append(btn("ghost warn small", tr("deleteCh"), () => { if (confirm(tr("delChConfirm"))) col("challenges").doc(c.id).delete().catch(e => toast(socialErr(e))); })); card.append(row);

  cloud.auth.onAuthStateChanged(async user => {
    if (user) {
      if (needsVerify(user)) { showVerify(user); return; }     // email/password accounts must confirm first
      await enterApp(user);
    } else {
      cloud.user = null;
      if (!localMode) showAuth(false);
    }
  });
}
boot();
</script>
</body>
